sirius:
  topology:
    num_gpus: 1
  memory:
    gpu:
      # Keep the dynamic-load child independent of whatever GPU memory the parent suite retains.
      usage_limit_bytes: 256 MiB
      reservation_limit_bytes: 128 MiB
    host:
      capacity_bytes: 160000000
      reservation_limit_fraction: 0.9
      downgrade_trigger_fraction: 0.8
      downgrade_stop_fraction: 0.7
    disk:
      disk_id: 0
      capacity_bytes: 1000000000
      downgrade_root_dirs: "/tmp/sirius_disk_memory"
  executor:
    pipeline:
      num_threads: 4
    downgrade:
      num_threads: 1
      monitor_period: 10ms
  operator_params:
    enable_dense_count_join: true
  telemetry:
    enable_quent: false
    output_directory: "/tmp/sirius_telemetry_config_test"
    engine_name: "sirius_config_test"
